name: Deploy Portfolio

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/nathans09/portfolio:latest
          # Décommente et ajoute tes secrets ici SI Next.js en a besoin au moment du build
          # build-args: |
          #   NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Connexion au registre GitHub depuis le VPS
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. On va dans le dossier de ta stack globale
            cd /home/ubuntu/saas/
            
            # 3. On télécharge la nouvelle image fraîchement compilée
            sudo docker pull ghcr.io/nathans09/portfolio:latest
            
            # 4. On relance UNIQUEMENT le portfolio (Nginx fera la bascule automatiquement)
            sudo docker compose up -d portfolio
